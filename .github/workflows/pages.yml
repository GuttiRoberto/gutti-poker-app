# Publică analizorul pe GitHub Pages la fiecare push pe main.
# Se publică doar pagina (dist/analizor.html); mâinile din test/fixtures nu ajung pe site.
name: Publicare pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Teste
        run: node --test
      - name: Construiește pagina
        run: |
          node scripts/build.mjs
          mkdir _site
          cp dist/analizor.html _site/index.html
          cp dist/analizor.html _site/analizor.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
