[package]
name = "native-bench"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", features = ["zstd"] }

# versiune fixată: solverul din 2023 nu compilează cu bincode 2.0 final
bincode = "=2.0.0-rc.3"
